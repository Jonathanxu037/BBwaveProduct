<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>运营需求确认</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body class="oc-page">
<div class="with-nav">
<div class="oc">

<header class="ck-head oc-head">
  <div class="k">OPERATION CONFIRM</div>
  <h1>老用户充值转盘 · 运营需求确认 · v1.0</h1>
  <div class="d">上方切换查看原型，下方填写意见并「添加」到右侧列表；勾选要提交的意见，点「确认提交」保存为一个版本的运营需求修改意见。<span class="oc-role" id="role"></span></div>
</header>
<div class="oc-note" role="note">※ 运营提交的意见（含截图）、产品回复和补充都保存在云端，换电脑、换浏览器都能看到，每分钟自动刷新。产品回复后，这条意见不能再修改或删除，只能补充；封板后只有产品能补充。重新打包上传不会删除或覆盖这些记录。『下载』『复制』只用于留档或贴到 Jira。</div>
<div class="oc-sealbar" id="sealBar" role="status" hidden></div>

<div class="oc-main">
<div class="oc-left">

<section class="oc-top" aria-label="原型查看">
  <div class="oc-bar">
    <label class="oc-lb" for="pg">原型页面</label>
    <select id="pg" class="oc-sel"></select>
    <div class="oc-views" id="views" role="group" aria-label="切换视图"></div>
    <label class="oc-mkon" title="在原型上标出各版本改过的页面内容"><input type="checkbox" id="mkOn" checked> 修改标注</label>
    <span class="oc-mkw"><button type="button" class="tb-btn" id="mkList" aria-haspopup="true">修改清单（0）</button><div class="oc-mkpop" id="mkPop" hidden></div></span>
    <span class="oc-sp"></span>
    <button type="button" class="tb-btn" id="reload">刷新</button>
    <a class="tb-btn" id="newwin" target="_blank" rel="noopener">原型新窗口打开 ↗</a>
  </div>
  <iframe id="pf" title="原型页面"></iframe>
</section>

<div class="oc-split" id="split" role="separator" aria-orientation="horizontal" aria-label="拖动调整上下高度" tabindex="0"></div>

<section class="oc-bottom" aria-label="填写意见">
  <div class="oc-tools" role="toolbar" aria-label="格式">
    <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
    <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
    <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
    <button type="button" data-cmd="formatBlock" data-arg="H3" title="小标题">标题</button>
    <button type="button" data-cmd="formatBlock" data-arg="P" title="正文">正文</button>
    <button type="button" data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
    <button type="button" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
    <button type="button" data-cmd="removeFormat" title="清除格式">清除格式</button>
    <span class="oc-tsep"></span>
    <button type="button" id="upBtn" class="oc-up">上传截图</button>
    <button type="button" id="pasteBtn" class="oc-up" title="把剪贴板里的图片直接贴进来，也可以在任意位置按 Ctrl+V">粘贴截图</button>
    <button type="button" id="locBtn" title="插入「【页面 › 视图】」，说明意见针对哪里">插入当前位置</button>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,.png,.jpg,.jpeg,.webp,.gif,.bmp" multiple hidden>
  </div>
  <div class="oc-editing" id="editing" hidden></div>
  <div class="oc-ed" id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="意见内容" data-ph="在这里填写一条意见：哪里要改、要改成什么样。截图或复制图片后，直接按 Ctrl+V 或点「粘贴截图」就能贴进来；也可以点「上传截图」或把图片拖进来。写完点「添加」，意见会进入右侧列表。"></div>
  <div class="oc-foot">
    <span class="oc-st" id="st" role="status"></span>
    <span class="oc-sp"></span>
    <label class="oc-lb" for="pri">优先级</label>
    <select id="pri" class="oc-sel"><option>高</option><option selected>中</option><option>低</option></select>
    <button type="button" class="tb-btn" id="cancelEdit" hidden>取消修改</button>
    <button type="button" class="tb-btn" id="clear">清空</button>
    <button type="button" class="tb-btn oc-pri" id="add">添加</button>
  </div>
</section>

</div>

<aside class="oc-side" aria-label="意见列表">
  <div class="oc-tabs" role="tablist">
    <button type="button" role="tab" id="tabList" aria-selected="true">意见列表 <span class="n" id="nList">0</span></button>
    <button type="button" role="tab" id="tabVer" aria-selected="false">已提交版本 <span class="n" id="nVer">0</span></button>
  </div>
  <div class="oc-pane" id="paneList" role="tabpanel" aria-labelledby="tabList">
    <div class="oc-mod" id="modBar" hidden></div>
    <div class="oc-lhead">
      <label><input type="checkbox" id="all"> 全选</label>
      <span class="oc-sp"></span>
      <span id="selInfo">已选 0 / 共 0 条</span>
    </div>
    <div class="oc-list" id="list"></div>
    <div class="oc-submit">
      <div class="oc-next" id="nextName"></div>
      <button type="button" class="oc-go" id="submit" disabled>确认提交</button>
    </div>
  </div>
  <div class="oc-pane" id="paneVer" role="tabpanel" aria-labelledby="tabVer" hidden>
    <div class="oc-sync" id="syncBar">
      <span class="oc-sync-t" id="syncTxt">正在读取云端…</span>
      <button type="button" class="oc-a" id="syncBtn">刷新</button>
    </div>
    <div class="oc-lhead">
      <button type="button" class="oc-a" id="impBtn" title="连不上云端时备用：导入从本页下载的版本文件（含产品回复）" hidden>⇪ 导入版本文件</button>
      <span class="oc-sp"></span><span>点版本名称查看详情</span>
      <input type="file" id="impFile" accept=".html,text/html" hidden>
    </div>
    <div class="oc-list" id="vers"></div>
    <div class="oc-submit">
      <div class="oc-next" id="sealInfo"></div>
      <button type="button" class="oc-go oc-seal" id="seal" disabled>运营需求封板</button>
    </div>
  </div>
</aside>

</div>
</div>
</div>
<div class="oc-modal" id="vd" role="dialog" aria-modal="true" aria-labelledby="vdTitle" hidden>
  <div class="oc-mbox">
    <div class="oc-mhead">
      <span class="oc-vno" id="vdNo"></span>
      <div class="oc-mt"><b id="vdTitle"></b><div class="oc-vm" id="vdMeta"></div></div>
      <button type="button" class="tb-btn" id="vdCopy">复制</button>
      <button type="button" class="tb-btn" id="vdDl">下载</button>
      <button type="button" class="tb-btn" id="vdClose" aria-label="关闭">关闭 ×</button>
    </div>
    <div class="oc-mbody">
      <table class="oc-dt">
        <thead><tr><th class="c-no">序号</th><th class="c-img">截图</th><th>修改意见（运营填写）</th><th class="c-rep">产品回复及补充</th><th class="c-dec">是否修改</th></tr></thead>
        <tbody id="vdRows"></tbody>
      </table>
    </div>
    <div class="oc-mfoot" id="vdFoot"></div>
  </div>
</div>
<div class="oc-lightbox" id="lb" hidden><img alt="截图大图"></div>
<script>window.NAV_ROOT = "../"; window.NAV_AUTO_HIDE = true; /* 默认隐藏目录栏，原型可看全宽 */</script>
<script src="../assets/nav-data.js"></script>
<script src="../assets/nav.js"></script>
<script src="../assets/proto-changes.js"></script>
<script src="../assets/oc-store.js"></script>
<script>
(function () {
  var ROOT = "../", TOPIC = "老用户充值转盘", VER = "v1.0";
  var KEY = TOPIC + "功能需求-运营需求确认";   /* 不含版本号：需求升版本后，已提交的意见和产品回复照样保留 */
  /* 角色由 assets/nav.js 统一识别（访问链接 ?role=pdm / opr / dev）。本页只对产品（pdm）和运营（opr）开放：
     产品可以填写产品回复和是否修改，运营只能查看；开发和未指定角色时由 nav.js 显示「无权访问」，本页功能不加载。 */
  var ROLE = window.NAV && NAV.role === "pdm" ? "product" : window.NAV && NAV.role === "opr" ? "ops" : "";
  if (!ROLE) return;
  /* 截图：单张原图不超过 10 MB；默认原样保留（不缩放、不重新压缩），只有超大图（宽度超过 3840 像素，或文件超过 5 MB 且宽度超过 2880 像素）
     才按比例缩到 2880 像素宽（相当于苹果 Retina 屏全屏宽度），高质量插值，PNG 仍存 PNG（无损），JPG/WEBP 质量 0.95 */
  var MAX_MB = 10, BIG_W = 3840, BIG_MB = 5, FIT_W = 2880;
  /* 原型的视图（按页面路径）；没有列出的页面只显示整页 */
  var VIEWS = {
    "prototype/admin/老用户充值转盘-后台活动管理页面.html": [["list", "活动列表"], ["new", "创建活动"], ["edit", "编辑活动"]]
  };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function z(n) { return ("0" + n).slice(-2); }
  /* 版本名称、回复和补充的时间一律按 GMT+8 生成（不依赖电脑时区），精确到秒 */
  function stamp() { return OCStore.stamp(); }

  /* ---------- 上半部分：原型查看 ---------- */
  var pages = [];
  (function walk(n, path) {
    if (n.type === "page" || n.type === "admin") pages.push({ href: n.href, title: n.title, group: path[path.length - 1] || "" });
    (n.children || []).forEach(function (c) { walk(c, n.children ? path.concat(n.title) : path); });
  })(window.NAV_DATA, []);
  var pg = $("pg"), pf = $("pf"), vbox = $("views"), nw = $("newwin");
  pages.forEach(function (p, i) { var o = document.createElement("option"); o.value = i; o.textContent = (p.group ? p.group + " › " : "") + p.title; pg.appendChild(o); });
  var cur = { page: 0, view: "" };
  function loadPage(i, view) {
    var p = pages[i]; if (!p) return;
    cur.page = i; pg.value = i;
    var vs = VIEWS[p.href] || [];
    cur.view = view || (vs[0] ? vs[0][0] : "");
    var url = ROOT + p.href + (cur.view ? "#" + cur.view : "");
    pf.src = url; nw.href = url;
    resetMarks();
    vbox.innerHTML = "";
    vs.forEach(function (v) {
      var b = document.createElement("button"); b.type = "button"; b.textContent = v[1]; b.dataset.v = v[0];
      b.onclick = function () { setView(v[0], true); };
      vbox.appendChild(b);
    });
    markView();
  }
  function setView(v, drive) {
    cur.view = v; markView();
    var url = ROOT + pages[cur.page].href + "#" + v; nw.href = url;
    if (drive) { try { pf.contentWindow.location.hash = v; } catch (e) { pf.src = url; } }
  }
  function markView() { [].forEach.call(vbox.children, function (b) { b.setAttribute("aria-pressed", b.dataset.v === cur.view); }); }
  pg.onchange = function () { loadPage(+pg.value); };
  $("reload").onclick = function () { loadPage(cur.page, cur.view); };
  window.addEventListener("message", function (e) {
    if (e.source === pf.contentWindow && e.data && e.data.type === "proto-view") { setView(e.data.view, false); openKey = null; schedule(); }
  });

  /* ---------- 原型修改标注 ----------
     数据在 assets/proto-changes.js。只显示「页面」类修改（页面上看得到的控件、文案、布局、交互）；
     逻辑层修改（判定规则、接口、数据口径）不在这里显示，只在 PRD 里标注。首版 v1.0 不做标注。 */
  var CH = (window.PROTO_CHANGES || []).filter(function (c) { return c && c.page && c.target && c.ver && c.type !== "逻辑"; });
  function vnum(v) { var m = /(\d+)\.(\d+)/.exec(v || ""); return m ? +m[1] * 1000 + +m[2] : 0; }
  function vl(v) { return /^v/i.test(v) ? v : "v" + v; }
  var LATEST = CH.reduce(function (m, c) { return vnum(c.ver) > vnum(m) ? c.ver : m; }, "");
  var mkOn = true, openKey = null, raf = 0, mo = null;
  var MK_CSS =
    "#ocMarks{position:absolute;left:0;top:0;width:0;height:0;z-index:2147483000;pointer-events:none;font-family:'Microsoft YaHei','微软雅黑',sans-serif}" +
    "#ocMarks .bx{position:absolute;box-sizing:border-box;border:2px solid #FADB14;background:rgba(255,245,102,.22);border-radius:4px}" +
    "#ocMarks .bx.old{border-color:#E8DDB0;background:rgba(255,251,224,.3)}" +
    "#ocMarks .tg{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-100%,-55%);font:800 10.5px/17px 'Microsoft YaHei',sans-serif;padding:0 6px;border-radius:4px;border:0;background:#FADB14;color:#5C3D00;box-shadow:0 1px 4px rgba(0,0,0,.28)}" +
    "#ocMarks .tg.old{background:#F3EAC2;color:#9A8752}" +
    "#ocMarks .tg:focus-visible{outline:2px solid #16052F;outline-offset:1px}" +
    "#ocMarks .pop{position:absolute;pointer-events:auto;box-sizing:border-box;background:#fff;color:#1B1720;border:1px solid #D9D2E4;border-top:3px solid #FADB14;border-radius:8px;box-shadow:0 10px 28px rgba(22,5,47,.24);padding:10px 12px 8px;font-size:12.5px;line-height:1.65;text-align:left}" +
    "#ocMarks .pop .t{font-weight:700;font-size:13px;color:#16052F;padding-right:18px;margin-bottom:4px}" +
    "#ocMarks .pop .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:16px;line-height:1;color:#6A6076;cursor:pointer}" +
    "#ocMarks .pop .v{font-weight:700;margin-top:6px}#ocMarks .pop .v span{display:inline-block;font-size:10.5px;line-height:17px;padding:0 5px;border-radius:3px;background:#FADB14;color:#5C3D00;margin-right:6px}" +
    "#ocMarks .pop .v.old span{background:#F3EAC2;color:#9A8752}#ocMarks .pop .v small{font-weight:400;color:#6A6076}" +
    "#ocMarks .pop .h{margin-top:8px;padding-top:6px;border-top:1px dashed #D9D2E4;color:#6A6076;font-size:12px}" +
    "#ocMarks .pop ul{margin:2px 0 4px;padding-left:18px}#ocMarks .pop li{margin:1px 0}";
  function pageChanges() {
    var href = pages[cur.page] ? pages[cur.page].href : "", g = {};
    CH.forEach(function (c) { if (c.page === href) (g[c.target] = g[c.target] || []).push(c); });
    Object.keys(g).forEach(function (k) { g[k].sort(function (a, b) { return vnum(b.ver) - vnum(a.ver); }); });
    return g;
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(renderMarks); }
  function resetMarks() { openKey = null; $("mkPop").hidden = true; updateMkBtn(); }
  function frameDoc() { try { return pf.contentDocument; } catch (e) { return null; } }
  function renderMarks() {
    raf = 0;
    var doc = frameDoc(); if (!doc || !doc.body) return;
    var layer = doc.getElementById("ocMarks");
    if (!layer) {
      var st = doc.createElement("style"); st.textContent = MK_CSS; doc.head.appendChild(st);
      layer = doc.createElement("div"); layer.id = "ocMarks"; doc.body.appendChild(layer);
    }
    layer.innerHTML = "";
    if (!mkOn) return;
    var g = pageChanges(), win = pf.contentWindow, sx = win.scrollX, sy = win.scrollY;
    Object.keys(g).forEach(function (sel) {
      var el; try { el = doc.querySelector(sel); } catch (e) { return; }
      if (!el) return;
      var r = el.getBoundingClientRect(); if (!r.width && !r.height) return;   /* 不在当前视图（被隐藏）时不标 */
      var list = g[sel], old = list[0].ver !== LATEST ? " old" : "";
      var bx = doc.createElement("div"); bx.className = "bx" + old;
      bx.style.cssText = "left:" + (r.left + sx - 3) + "px;top:" + (r.top + sy - 3) + "px;width:" + (r.width + 6) + "px;height:" + (r.height + 6) + "px";
      var tg = doc.createElement("button"); tg.type = "button"; tg.className = "tg" + old; tg.textContent = vl(list[0].ver);
      tg.title = "点击查看 " + vl(list[0].ver) + " 对这里做了哪些修改";
      tg.style.cssText = "left:" + (r.right + sx + 3) + "px;top:" + (r.top + sy - 3) + "px";
      tg.onclick = function (e) { e.preventDefault(); e.stopPropagation(); openKey = openKey === sel ? null : sel; schedule(); };
      layer.appendChild(bx); layer.appendChild(tg);
      if (openKey === sel) layer.appendChild(popFor(doc, list, r, sx, sy));
    });
  }
  function popFor(doc, list, r, sx, sy) {
    var vw = doc.documentElement.clientWidth, w = Math.min(320, vw - 16);
    var left = Math.max(sx + 8, Math.min(r.right + sx - w, sx + vw - w - 8));
    var p = doc.createElement("div"); p.className = "pop"; p.setAttribute("role", "dialog");
    p.style.cssText = "left:" + left + "px;top:" + (r.bottom + sy + 8) + "px;width:" + w + "px";
    function block(c, older) {
      return '<div class="v' + (older ? " old" : "") + '"><span>' + esc(vl(c.ver)) + "</span>" + (older ? "" : "本版本修改") + (c.date ? " <small>" + esc(c.date) + "</small>" : "") + "</div>" +
        "<ul>" + (c.items || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
    }
    p.innerHTML = '<button type="button" class="x" aria-label="关闭">×</button><div class="t">' + esc(list[0].title || "页面修改") + "</div>" + block(list[0], false) +
      (list.length > 1 ? '<div class="h">更早的修改</div>' + list.slice(1).map(function (c) { return block(c, true); }).join("") : "");
    p.querySelector(".x").onclick = function (e) { e.stopPropagation(); openKey = null; schedule(); };
    p.onclick = function (e) { e.stopPropagation(); };
    return p;
  }
  /* 原型每次重新加载：挂上监听，原型里的弹层、视图切换、滚动都会触发重新定位 */
  pf.addEventListener("load", function () {
    var doc = frameDoc(), win = pf.contentWindow; if (!doc || !doc.body) return;
    if (mo) mo.disconnect();
    mo = new win.MutationObserver(function (ms) {
      var L = doc.getElementById("ocMarks");
      if (L && ms.every(function (m) { return L.contains(m.target); })) return;
      schedule();
    });
    mo.observe(doc.body, { subtree: true, childList: true, attributes: true, characterData: true });
    win.addEventListener("resize", schedule);
    doc.addEventListener("scroll", schedule, true);
    doc.addEventListener("click", function () { if (openKey) { openKey = null; schedule(); } });
    schedule();
  });
  var mkBtn = $("mkList"), mkPop = $("mkPop");
  function updateMkBtn() { mkBtn.textContent = "修改清单（" + Object.keys(pageChanges()).length + "）"; }
  function viewName(v) { var vs = VIEWS[pages[cur.page] ? pages[cur.page].href : ""] || []; var x = vs.filter(function (y) { return y[0] === v; })[0]; return x ? x[1] : ""; }
  mkBtn.onclick = function (e) {
    e.stopPropagation();
    if (!mkPop.hidden) { mkPop.hidden = true; return; }
    var g = pageChanges(), keys = Object.keys(g);
    mkPop.innerHTML = keys.length ? keys.map(function (sel) {
      var c = g[sel][0], vn = viewName(c.view);
      return '<button type="button" data-sel="' + esc(sel) + '"><span class="vtag' + (c.ver !== LATEST ? " old" : "") + '">' + esc(vl(c.ver)) + "</span>" + esc(c.title || "页面修改") + (vn ? "<small>" + esc(vn) + "</small>" : "") + "</button>";
    }).join("") : '<div class="oc-mkempty">这个原型页面还没有修改标注。首版 v1.0 不做标注；之后每个版本对页面的修改会列在这里，点一条可跳到对应位置。逻辑层的修改不在这里显示，请看 PRD。</div>';
    mkPop.hidden = false;
  };
  mkPop.onclick = function (e) {
    var b = e.target.closest("[data-sel]"); if (!b) return;
    var sel = b.dataset.sel, c = pageChanges()[sel][0];
    mkPop.hidden = true; mkOn = true; $("mkOn").checked = true;
    if (c.view && c.view !== cur.view) setView(c.view, true);
    setTimeout(function () {
      var doc = frameDoc(), el = null; try { el = doc && doc.querySelector(sel); } catch (x) {}
      if (el) el.scrollIntoView({ block: "center" });
      openKey = sel; schedule();
    }, 250);
  };
  document.addEventListener("click", function (e) { if (!mkPop.hidden && !mkPop.contains(e.target) && e.target !== mkBtn) mkPop.hidden = true; });
  $("mkOn").onchange = function () { mkOn = this.checked; openKey = null; schedule(); };
  if (pages.length) loadPage(0); else { pg.disabled = true; pf.replaceWith(Object.assign(document.createElement("div"), { className: "oc-empty", textContent: "本需求暂无原型页面" })); }
  function where() {
    var p = pages[cur.page], vs = VIEWS[p ? p.href : ""] || [], v = vs.filter(function (x) { return x[0] === cur.view; })[0];

    if (location.hash === "#versions") showTab("ver");   /* 从「需求修改总结」点「查看全部版本」进来 */
    var mv = /^#ver=(.+)$/.exec(location.hash);          /* 从入口页「运营需求修改记录」点某个版本进来：直接打开该版本详情 */
    function openFromHash() {
      if (!mv) return true;
      var nm = decodeURIComponent(mv[1]), hit = S.versions.filter(function (x) { return x.name === nm; })[0];
      showTab("ver");
      if (hit) { openDetail(hit); mv = null; return true; }
      return false;
    }
    var opened = openFromHash();
    syncUI(CLOUD ? "loading" : OCSync.supported ? "none" : "na");
    /* 云端模式：每分钟自动刷新一次，别人提交的意见和产品回复会自动出现（正在编辑回复时不刷新详情） */
    window.addEventListener("pdm-unlocked", function () { syncNow(false); });
    if (CLOUD) setInterval(function () { if (!document.hidden && !(curV && document.activeElement && document.activeElement.classList.contains("oc-reply"))) syncNow(false); }, 60000);
    /* 打开页面时自动从共享文件夹读取（已授权时不弹窗） */
    syncNow(false).then(function () {
      if (!opened && !openFromHash()) say(CLOUD ? "云端没有找到这个版本，请点『刷新』（「" + decodeURIComponent(/^#ver=(.+)$/.exec(location.hash)[1]) + "」）"
        : "没有找到「" + decodeURIComponent(/^#ver=(.+)$/.exec(location.hash)[1]) + "」这个版本；请先连接共享文件夹或导入版本文件", true);
    });
  });
})();
</script>
</body>
</html>
