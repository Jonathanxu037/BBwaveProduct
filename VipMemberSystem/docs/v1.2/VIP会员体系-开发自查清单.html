   ["fn", "bq", 1, "单人结算未完成的处理", "按 PRD 7.5「结算未完成的常见原因与处理」逐类模拟（投注数据未就绪、注单回滚、账号状态变化、并发冲突、等级配置对不上、数据异常、写入超时）：每 30 分钟重试 1 次、最多 3 次，仍失败记「未完成」，等级不变、不生成月度工资，列表「部分完成」；结算开始 +「结算告警时间」（默认 30 分钟）告警，重试结束后发汇总告警；点「重新结算」补结算后才能点「完成」，补结算的月度工资记入原结算月份；整次失败记「结算失败」并锁定等级配置；投注月份归属按规则 N4「有效投注」③；明细「失败原因」列显示原因分类", "v1.2"],

   ["fn", "fbq", 0, AD, ADE, "v1.2"],
   ["fn", "fbq", 1, "权限点逐项配置：每次只给一个权限点", "权限点与 PRD 7.1 一致：VIP会员等级配置（查看、编辑门槛表、新增等级、删除等级）；VIP会员等级奖励配置（查看、编辑奖金表、编辑奖励规则参数、「VIP领取奖励」开关、「KYC 限制」开关、领取方式）；活动奖励统计（查看、放行、作废、整批作废、补发（含重试）、导出）；VIP月度结算记录（查看、导出、重新结算、完成）；审批；操作日志查看。不做旧权限对应；无权限按钮置灰、提示「没有权限」，接口同样拦截（Q56）", "v1.2"]

 ]}

var VER = "v1.2", ITER = "v1.2", BASE = "VIP会员体系功能需求-" + (ITER ? ITER + "-" : ""), KEY = BASE + VER + "-checklist";
document.getElementById("hdVer").textContent = VER;
var PREV = (function () {
  function vn(v) { var m = /^v(\d+)\.(\d+)$/.exec(v || ""); return m ? (+m[1]) * 1000 + (+m[2]) : -1; }
  var best = "", bestN = -1, cur = vn(VER);
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(BASE) !== 0 || !/-checklist$/.test(k)) continue;
    var v = k.slice(BASE.length, -"-checklist".length), n = vn(v); if (n >= 0 && n < cur && n > bestN) { best = k; bestN = n; } } } catch (e) {}
  return best;
})();
var RN = { d: "设计", f: "前端", b: "后端", q: "测试" }, TN = { fn: "功能", bd: "边界值", ex: "异常", un: "非常规" };
var F = { role: "all", type: "all", state: "all" };
var store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { store = null; }
try { var sv = JSON.parse(localStorage.getItem(KEY + "-filters") || "{}"); if (sv.role) F = sv; } catch (e) {}
var MIGRATE = store === null; if (MIGRATE) store = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); localStorage.setItem(KEY + "-filters", JSON.stringify(F)); } catch (e) {} }
function done(it, role) {
  var rs = role === "all" ? it.r.split("") : [role];
  return rs.every(function (r) { return store[r + ":" + it.id]; });
}
function setDone(it, on) { (F.role === "all" ? it.r.split("") : [F.role]).forEach(function (r) { if (on) store[r + ":" + it.id] = 1; else delete store[r + ":" + it.id]; }); }
var ITEMS = [];
DATA.forEach(function (fp) { fp.s.forEach(function (s) { s.i.forEach(function (x, k) {
  var it = { id: s.c + "-" + (k + 1), fp: fp, sub: s, t: x[0], r: x[1], key: !!x[2], q: x[3], e: x[4], v: x[5] || "" }; ITEMS.push(it); s.items = (s.items || []).concat(it);
}); }); });
function inRole(it) { return F.role === "all" || it.r.indexOf(F.role) >= 0; }
function visible(it) {
  if (!inRole(it)) return false;
  if (F.type === "fn" && it.t !== "fn") return false;
  if (F.type === "bd" && it.t !== "bd") return false;
  if (F.type === "ex" && it.t !== "ex" && it.t !== "un") return false;
  var d = done(it, F.role);
  if (F.state === "todo" && d) return false;
  if (F.state === "done" && !d) return false;
  if (F.state === "key" && !it.key) return false;
  return true;
}
function stat(list) { var n = list.length, c = list.filter(function (it) { return done(it, F.role); }).length; return { n: n, c: c, p: n ? Math.round(c * 100 / n) : 0 }; }
var closed = {};
function render() {
  var html = "";
  DATA.forEach(function (fp) {
    var all = []; fp.s.forEach(function (s) { all = all.concat(s.items.filter(inRole)); });
    var vis = all.filter(visible); if (!vis.length) return;
    var st = stat(all), tag = st.c === 0 ? '<span class="stt">未开始</span>' : st.c === st.n ? '<span class="stt done">已完成</span>' : '<span class="stt ing">进行中</span>';
    html += '<section class="fpc' + (closed[fp.c] ? " closed" : "") + '" data-fp="' + fp.c + '"><div class="fpc-h">' +
      '<button class="tri" type="button" data-tog="' + fp.c + '" aria-label="展开或收起">▼</button><span class="code">' + fp.c + '</span><span class="nm">' + fp.n + "</span>" + tag +
      '<span class="mbar"><i style="width:' + st.p + '%"></i></span><span class="num">' + st.c + " / " + st.n + "</span>" +
      '<button class="selall" type="button" data-sel="' + fp.c + '">全选本组</button><button class="gopr" type="button" data-pr="' + fp.c + '">查看 PRD ›</button></div><div class="fpc-b">';
    fp.s.forEach(function (s) {
      var sv = s.items.filter(visible); if (!sv.length) return;
      var ss = stat(s.items.filter(inRole));
      html += '<div class="sub-h"><span class="code2">' + s.c + '</span><span class="nm">' + s.n + '</span><span class="mbar"><i style="width:' + ss.p + '%"></i></span><span class="num">' + ss.c + " / " + ss.n + '</span><button class="gopr" type="button" data-pr="' + s.c + '">查看 PRD ›</button></div><ul class="items">';
      sv.forEach(function (it) {
        var d = done(it, F.role);
        html += '<li class="' + (d ? "done" : "") + (it.v ? " vmark" + (it.v === VER ? "" : " old") : "") + '"><input type="checkbox" data-id="' + it.id + '"' + (d ? " checked" : "") + ' aria-label="' + it.q.replace(/"/g, "&quot;") + '"><div><span class="tx">' + it.q +
          '<span class="tags"><span class="lb t-' + it.t + '">' + TN[it.t] + "</span>" + it.r.split("").map(function (r) { return '<span class="lb r-' + r + '">' + RN[r] + "</span>"; }).join("") + (it.key ? '<span class="lb key">关键</span>' : "") +
          (it.v ? '<sup class="vtag' + (it.v === VER ? "" : " old") + '" title="' + it.v + '">' + it.v + "</sup>" : "") +
          '</span></span><span class="ex">预期：' + it.e + "</span></div></li>";
      });
      html += "</ul>";
    });
    html += "</div></section>";
  });
  document.getElementById("list").innerHTML = html || '<div class="empty">当前筛选下没有检查项</div>';
  var t = stat(ITEMS.filter(inRole));
  document.getElementById("tp").textContent = t.p + "%";
  document.getElementById("tn").textContent = t.c + " / " + t.n + " 项";
  document.getElementById("tb").style.width = t.p + "%";
}
var byId = {}; ITEMS.forEach(function (it) { byId[it.id] = it; });
if (MIGRATE && PREV) { try { var old = JSON.parse(localStorage.getItem(PREV) || "{}"); Object.keys(old).forEach(function (k) { var it = byId[k.split(":")[1]]; if (it && it.v !== VER) store[k] = old[k]; }); } catch (e) {} save(); }
var list = document.getElementById("list");
list.addEventListener("change", function (e) { var id = e.target.dataset.id; if (!id) return; setDone(byId[id], e.target.checked); save(); render(); });
list.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tog) { closed[b.dataset.tog] = !closed[b.dataset.tog]; b.closest(".fpc").classList.toggle("closed"); }
  if (b.dataset.sel) {
    var its = ITEMS.filter(function (it) { return it.fp.c === b.dataset.sel && visible(it); });
    var allOn = its.every(function (it) { return done(it, F.role); });
    its.forEach(function (it) { setDone(it, !allOn); }); save(); render();
  }
  if (b.dataset.pr) showPRD(b.dataset.pr);
});
var frame = document.getElementById("prd"), ready = false, pending = null;
frame.addEventListener("load", function () { ready = true; if (pending) { frame.contentWindow.postMessage({ type: "prd-show", code: pending }, "*"); pending = null; } });
function showPRD(code) {
  if (window.matchMedia("(max-width:699px)").matches) { window.open("VIP会员体系-需求开发PRD文档.html#" + code, "_blank"); return; }
  if (!ready) { pending = code; return; }
  frame.contentWindow.postMessage({ type: "prd-show", code: code }, "*");
}
document.getElementById("up").onclick = function () { frame.contentWindow.postMessage({ type: "prd-step", dir: -1 }, "*"); };
document.getElementById("dn").onclick = function () { frame.contentWindow.postMessage({ type: "prd-step", dir: 1 }, "*"); };
window.addEventListener("message", function (e) {
  var d = e.data || {}; if (d.type !== "prd-hits") return;
  document.getElementById("hitn").textContent = d.total ? "第 " + (d.pos + 1) + " / " + d.total + " 处标注" : "";
});
var GROUPS = { role: [["all", "全部"], ["d", "设计"], ["f", "前端"], ["b", "后端"], ["q", "测试"]], type: [["all", "全部"], ["fn", "功能"], ["bd", "边界值"], ["ex", "异常与非常规操作"]], state: [["all", "全部"], ["todo", "未完成"], ["done", "已完成"], ["key", "仅关键项"]] };
Object.keys(GROUPS).forEach(function (g) {
  var box = document.querySelector('[data-g="' + g + '"]');
  GROUPS[g].forEach(function (o) {
    var b = document.createElement("button"); b.type = "button"; b.className = "pill"; b.textContent = o[1]; b.setAttribute("aria-pressed", F[g] === o[0]);
    b.onclick = function () { F[g] = o[0]; box.querySelectorAll(".pill").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); save(); render(); };
    box.appendChild(b);
  });
});
document.getElementById("exall").onclick = function () { closed = {}; render(); };
document.getElementById("coall").onclick = function () { DATA.forEach(function (fp) { closed[fp.c] = true; }); render(); };
document.getElementById("prt").onclick = function () { window.print(); };
document.getElementById("clear").onclick = function () {
  var m = document.createElement("div"); m.className = "cfm";
  m.innerHTML = '<div role="dialog" aria-modal="true"><p><b>清空勾选</b></p><p>将清空本需求 ' + ITER + " " + VER + ' 在本浏览器里所有角色的勾选，不能撤销。</p><div class="row2"><button class="obtn" type="button" data-x="0">取消</button><button class="obtn" type="button" data-x="1" style="border-color:#C00000;color:#C00000">确认清空</button></div></div>';
  m.onclick = function (e) { var x = e.target.dataset.x; if (x === undefined) return; if (x === "1") { store = {}; save(); render(); } m.remove(); };
  document.body.appendChild(m);
};
document.getElementById("csv").onclick = function () {
  var rows = [["大功能点", "子功能点", "编号", "类型", "适用角色", "关键", "检查什么", "预期结果", "设计", "前端", "后端", "测试"]];
  ITEMS.forEach(function (it) {
    rows.push([it.fp.c + " " + it.fp.n, it.sub.c + " " + it.sub.n, it.id, TN[it.t], it.r.split("").map(function (r) { return RN[r]; }).join("/"), it.key ? "是" : "",
      it.q, it.e].concat(["d", "f", "b", "q"].map(function (r) { return it.r.indexOf(r) < 0 ? "-" : store[r + ":" + it.id] ? "已勾" : "未勾"; })));
  });
  var csv = "﻿" + rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "VIP会员体系-v1.2-开发自查清单-" + VER + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
};
(function () {
  var split = document.getElementById("split"), dv = document.getElementById("divider"), drag = false;
